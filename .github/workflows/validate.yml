name: validate
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - run: helm lint charts/demo-api
      - run: helm template demo charts/demo-api --namespace app-dev > /tmp/rendered.yaml
      - run: helm template demo-dev charts/demo-api --namespace app-dev -f environments/dev/values.yaml > /tmp/dev.yaml
      - run: helm template demo-prod charts/demo-api --namespace app-prod -f environments/prod/values.yaml > /tmp/prod.yaml
      - run: kustomize build platform/base > /tmp/platform.yaml
      - run: >-
          "$(go env GOPATH)/bin/kubeconform" -kubernetes-version 1.34.0 -summary -strict
          -ignore-missing-schemas /tmp/rendered.yaml /tmp/dev.yaml /tmp/prod.yaml /tmp/platform.yaml
      - uses: bridgecrewio/checkov-action@v12
        with: {directory: '.', framework: kubernetes, quiet: true}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: config, scan-ref: '.', severity: 'HIGH,CRITICAL', exit-code: '1'}
