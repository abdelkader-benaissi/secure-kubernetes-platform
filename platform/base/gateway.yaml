apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: demo-gateway, namespace: app-prod}
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: demo.local
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: demo-api-tls}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: demo-api, namespace: app-prod}
spec:
  parentRefs: [{name: demo-gateway, sectionName: https}]
  hostnames: [demo.local]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: demo-api, port: 80}]
