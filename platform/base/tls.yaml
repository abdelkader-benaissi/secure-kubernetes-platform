apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: lab-selfsigned}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: demo-api-tls, namespace: app-prod}
spec:
  secretName: demo-api-tls
  dnsNames: [demo.local]
  issuerRef: {name: lab-selfsigned, kind: ClusterIssuer}
